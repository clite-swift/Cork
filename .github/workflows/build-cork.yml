name: Build Cork (macOS)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Homebrew
        run: |
          echo | /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install mise & Tuist
        run: |
          brew install mise
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          mise install tuist@4.50.2

      - name: Generate Xcode project
        run: |
          mise exec tuist@4.50.2 -- tuist install
          mise exec tuist@4.50.2 -- tuist generate --no-binary-cache

      - name: Build Cork app
        run: |
          xcodebuild \
            -workspace Cork.xcworkspace \
            -scheme "Cork (Self-Compiled)" \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            ONLY_ACTIVE_ARCH=NO

      - name: Package Cork.app
        run: |
          mkdir -p output
          cp -R build/Build/Products/Release/Cork.app output/

      - name: Upload Cork.app
        uses: actions/upload-artifact@v4
        with:
          name: Cork.app
          path: output/Cork.app
