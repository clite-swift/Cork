name: Build Cork (macOS, ZIP)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Homebrew
        run: |
          echo | /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Install Tuist via Homebrew
        run: |
          brew tap tuist/tuist
          brew install tuist

      - name: Generate Xcode project
        run: |
          tuist install --no-update
          tuist generate --no-binary-cache

      - name: Build Cork.app
        run: |
          xcodebuild \
            -workspace Cork.xcworkspace \
            -scheme "Cork (Self-Compiled)" \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            ONLY_ACTIVE_ARCH=NO

      - name: Package as ZIP
        run: |
          mkdir -p output
          cd build/Build/Products/Release
          zip -r ../../../../output/Cork.zip Cork.app

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Cork.zip
          path: output/Cork.zip
