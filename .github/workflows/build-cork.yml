name: Build Cork (macOS, ZIP)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1️⃣ 下载源码
      - name: Checkout source
        uses: actions/checkout@v4

      # 2️⃣ 安装 Homebrew
      - name: Install Homebrew
        run: |
          echo | /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      # 3️⃣ 安装 Tuist（官方脚本，绕过 mise）
      - name: Install Tuist
        run: |
          curl -Ls https://install.tuist.io | bash -s -- --version 4.50.2
          echo "/Users/runner/.tuist/bin" >> $GITHUB_PATH

      # 4️⃣ 生成 Xcode 工程
      - name: Generate Xcode project
        run: |
          tuist install
          tuist generate --no-binary-cache

      # 5️⃣ 编译 Cork.app
      - name: Build Cork
        run: |
          xcodebuild \
            -workspace Cork.xcworkspace \
            -scheme "Cork (Self-Compiled)" \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            ONLY_ACTIVE_ARCH=NO

      # 6️⃣ 打包成 ZIP
      - name: Package Cork.app as ZIP
        run: |
          mkdir -p output
          cd build/Build/Products/Release
          zip -r ../../../../output/Cork.zip Cork.app

      # 7️⃣ 上传 ZIP
      - name: Upload Cork.zip
        uses: actions/upload-artifact@v4
        with:
          name: Cork.zip
          path: output/Cork.zip
